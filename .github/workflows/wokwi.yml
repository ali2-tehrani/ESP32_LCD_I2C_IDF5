name: ESP32 Build and Wokwi Simulation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32
          path: .

      - name: Install Wokwi CLI
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh
          echo "$HOME/.wokwi/bin" >> "$GITHUB_PATH"

      - name: Run Wokwi simulation
        continue-on-error: true
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          wokwi-cli . --timeout 60000 --serial-log-file wokwi.log

      - name: Show Wokwi serial log
        if: always()
        run: |
          echo "========== WOKWI SERIAL LOG =========="
          if [ -f wokwi.log ]; then
            cat wokwi.log
          else
            echo "wokwi.log was not created"
          fi
          echo "========== END WOKWI SERIAL LOG =========="

      - name: Upload Wokwi log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-log
          path: wokwi.log
          if-no-files-found: ignore
