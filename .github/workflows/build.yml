name: Build ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Locate ESP-IDF project
        shell: bash
        run: |
          PROJECT=$(find . -name CMakeLists.txt -type f \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "ESP-IDF project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install ESP-IDF 5.5.3
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.3

      - name: Clean old build
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR/build"

      - name: Build ESP32 firmware
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Setting target..."
          idf.py set-target esp32

          echo "Building firmware..."
          idf.py build

      - name: Show generated firmware
        shell: bash
        run: |
          echo "Generated files:"
          find "$PROJECT_DIR/build" -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
            -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_LCD_I2C_IDF5-firmware
          path: |
            ${{ env.PROJECT_DIR }}/build/*.bin
            ${{ env.PROJECT_DIR }}/build/bootloader/*.bin
            ${{ env.PROJECT_DIR }}/build/partition_table/*.bin
