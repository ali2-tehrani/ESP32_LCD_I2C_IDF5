name: Build ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir project
          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate ESP-IDF project
        shell: bash
        run: |
          PROJECT=$(find project -name CMakeLists.txt -type f \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install ESP-IDF 5.5.3
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.3

      - name: Clean old build
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR/build"

      - name: Build ESP32 firmware
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          idf.py set-target esp32
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_LCD_I2C_IDF5-firmware
          path: |
            ${{ env.PROJECT_DIR }}/build/ESP32_LCD_I2C_IDF5.bin
            ${{ env.PROJECT_DIR }}/build/bootloader/bootloader.bin
            ${{ env.PROJECT_DIR }}/build/partition_table/partition-table.bin
            ${{ env.PROJECT_DIR }}/build/ota_data_initial.bin
