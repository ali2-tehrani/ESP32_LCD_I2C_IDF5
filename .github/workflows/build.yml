name: Build ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ESP-IDF 5.5.3
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.3

      - name: Locate ESP-IDF project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"

          echo "ESP-IDF project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Clean old build
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR/build"

      - name: Set ESP32 target
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          idf.py set-target esp32

      - name: Restore project sdkconfig
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f sdkconfig.old ]; then
            echo "ERROR: sdkconfig.old not found"
            exit 1
          fi

          mv sdkconfig.old sdkconfig

          echo "Partition configuration:"
          grep "CONFIG_PARTITION_TABLE" sdkconfig

          echo
          echo "Custom partition table:"
          cat partitions.csv

          echo
          echo "Removing old build cache..."
          rm -rf build

      - name: Build ESP32 firmware
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building firmware..."
          idf.py build

      - name: Show generated firmware
        shell: bash
        run: |
          echo "Generated files:"
          find "$PROJECT_DIR/build" -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
            -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_LCD_I2C_IDF5-firmware
          path: |
            ${{ env.PROJECT_DIR }}/build/*.bin
            ${{ env.PROJECT_DIR }}/build/bootloader/*.bin
            ${{ env.PROJECT_DIR }}/build/partition_table/*.bin
